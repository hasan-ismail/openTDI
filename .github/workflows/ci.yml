# Tests, builds and lints both apps on every push to main and every pull request (owner, 2026-10-28: "use github actions
# to publish builds"; docs/SETUP.md §12). Builds use the stub instead of Samsung's SDK, and dexcheck.py confirms that no
# Samsung code is inside. The debug APKs are kept for 7 days; signed releases come from release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # compileSdk 37 and buildTools 36.0.0 (gradle/libs.versions.toml); sdkmanager skips what the runner already has.
      - name: Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic # the MIT-licensed cache; the default "enhanced" one is proprietary, under Gradle's own terms

      # mobile/libs/ is gitignored. fetchSherpaOnnx downloads the AAR when it is missing and checks its pinned SHA-256
      # either way, so a stale entry is replaced; keep this key in step with mobile/build.gradle.kts.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mobile/libs/sherpa-onnx-1.13.7.aar
          key: sherpa-onnx-1.13.7-c4ef49e309f24fcee5c106b8a279481aaecaabb078cd37b2cd6e9a62cc8a73c8

      - name: Test, build and lint
        run: >-
          bash ./gradlew :shared:test :wear:testDebugUnitTest :mobile:testDebugUnitTest
          :wear:assembleDebug :mobile:assembleDebug :wear:lintDebug :mobile:lintDebug
          -Popentdi.forceSamsungStub=true

      - name: No Samsung code in the APKs
        run: >-
          python3 tools/release/dexcheck.py
          wear/build/outputs/apk/debug/wear-debug.apk
          mobile/build/outputs/apk/debug/mobile-debug.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenTDI-debug-apks
          path: |
            wear/build/outputs/apk/debug/wear-debug.apk
            mobile/build/outputs/apk/debug/mobile-debug.apk
          retention-days: 7
          if-no-files-found: error
