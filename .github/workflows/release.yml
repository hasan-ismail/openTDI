# Publishes a GitHub Release for each pushed tag v<versionName> (owner, 2026-10-28: "use github actions to publish
# builds"; how to make one: docs/SETUP.md §12). Both apps are built with the stub instead of Samsung's SDK, signed with
# the one release key held in the repository secrets, and checked by dexcheck.py before anything is published.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # gh release create

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # No token stays in .git/config, so the Gradle build cannot use the write permission; only the publish step gets it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches versionName
        run: |
          version="${GITHUB_REF_NAME#v}"
          for f in mobile/build.gradle.kts wear/build.gradle.kts; do
            grep -qF "versionName = \"$version\"" "$f" || { echo "::error::$f: versionName is not \"$version\""; exit 1; }
          done

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # compileSdk 37 and buildTools 36.0.0 (gradle/libs.versions.toml); sdkmanager skips what the runner already has.
      - name: Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic # the MIT-licensed cache; the default "enhanced" one is proprietary, under Gradle's own terms

      # See ci.yml: fetchSherpaOnnx checks the pinned SHA-256 of whatever the cache restores.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mobile/libs/sherpa-onnx-1.13.7.aar
          key: sherpa-onnx-1.13.7-c4ef49e309f24fcee5c106b8a279481aaecaabb078cd37b2cd6e9a62cc8a73c8

      - name: Release key
        env:
          OPENTDI_KEYSTORE_BASE64: ${{ secrets.OPENTDI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$OPENTDI_KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret OPENTDI_KEYSTORE_BASE64 is missing (docs/SETUP.md §12)"
            exit 1
          fi
          printf '%s' "$OPENTDI_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/opentdi-release.jks"

      - name: Build the signed release APKs
        env:
          OPENTDI_KEYSTORE_FILE: ${{ runner.temp }}/opentdi-release.jks
          OPENTDI_KEYSTORE_PASSWORD: ${{ secrets.OPENTDI_KEYSTORE_PASSWORD }}
          OPENTDI_KEY_ALIAS: ${{ secrets.OPENTDI_KEY_ALIAS }}
          OPENTDI_KEY_PASSWORD: ${{ secrets.OPENTDI_KEY_PASSWORD }}
        run: bash ./gradlew :wear:assembleRelease :mobile:assembleRelease -Popentdi.forceSamsungStub=true

      - name: No Samsung code in the APKs
        run: >-
          python3 tools/release/dexcheck.py
          wear/build/outputs/apk/release/wear-release.apk
          mobile/build/outputs/apk/release/mobile-release.apk

      # The Data Layer only connects apps with the same signature, and the phone installs its embedded watch app.
      - name: One signing key for the phone, the watch and the embedded watch app
        run: |
          unzip -p mobile/build/outputs/apk/release/mobile-release.apk assets/watch.apk > "$RUNNER_TEMP/embedded-watch.apk"
          cert() { "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$1" | grep 'Signer #1 certificate SHA-256'; }
          phone=$(cert mobile/build/outputs/apk/release/mobile-release.apk)
          watch=$(cert wear/build/outputs/apk/release/wear-release.apk)
          embedded=$(cert "$RUNNER_TEMP/embedded-watch.apk")
          echo "$phone"
          if [ "$phone" != "$watch" ] || [ "$phone" != "$embedded" ]; then
            echo "::error::The apps are not signed with one key"
            exit 1
          fi

      - name: Collect the files
        run: |
          mkdir dist
          cp mobile/build/outputs/apk/release/mobile-release.apk dist/OpenTDI-phone.apk
          cp wear/build/outputs/apk/release/wear-release.apk dist/OpenTDI-watch.apk
          cd dist && sha256sum OpenTDI-phone.apk OpenTDI-watch.apk > SHA256SUMS && cat SHA256SUMS

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/OpenTDI-phone.apk dist/OpenTDI-watch.apk dist/SHA256SUMS
          --title "OpenTDI $GITHUB_REF_NAME" --notes-from-tag --verify-tag
