# Toolchain versions are the stack already proven on this machine (AGP 9.4.0 + Gradle 9.6.1 + Kotlin 2.4.10,
# resolved against live Maven metadata on 2026-09-01). AGP 9 compiles Kotlin itself for Android modules.
# Wear and Play-services versions: docs/references/wear_compose_and_versions.md (resolved 2026-10-27).

[versions]
agp = "9.4.0"
kotlin = "2.4.10"
compileSdk = "37"
targetSdk = "36"
wearMinSdk = "30"
mobileMinSdk = "33"
buildTools = "36.0.0"

coroutines = "1.11.0"
serializationJson = "1.11.0"
composeBom = "2026.08.00"
androidxCore = "1.19.0"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
# Wear Compose is not managed by the Compose BOM; 1.7.1 needs compileSdk >= 37 and AGP >= 9.1.0.
wearCompose = "1.7.1"
wearOngoing = "1.1.0"
wear = "1.3.0"
# The phone's Start the night opens the watch app (RemoteActivityHelper); 1.2.0 = latest stable on 2026-10-30.
wearRemoteInteractions = "1.2.0"
playServicesWearable = "20.0.1"
junit = "4.13.2"
# Kadb (Apache-2.0): the phone installs the watch app over Wireless debugging (2.1.5, 2026-10-15).
kadb = "2.1.5"
# D8 (BSD-3-Clause) turns the user's own Samsung kit into Android code on the phone (bring your own kit).
r8 = "9.5.23"

[libraries]
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-core = { group = "androidx.core", name = "core", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "androidxLifecycle" }

wear-compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
androidx-wear-ongoing = { group = "androidx.wear", name = "wear-ongoing", version.ref = "wearOngoing" }
androidx-wear = { group = "androidx.wear", name = "wear", version.ref = "wear" }
androidx-wear-remote-interactions = { group = "androidx.wear", name = "wear-remote-interactions", version.ref = "wearRemoteInteractions" }
# Phase 2 (Data Layer): MessageClient / ChannelClient only, never DataClient for the stream.
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }

kadb = { group = "com.flyfishxu", name = "kadb", version.ref = "kadb" }
r8 = { group = "com.android.tools", name = "r8", version.ref = "r8" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
